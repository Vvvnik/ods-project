# Конфигурация источников API для information-system
# Поддерживаются URL, локальные файлы и папки

sources:
  # URL источники
  - type: url
    path: "https://petstore.swagger.io/v2/swagger.json"
    description: "Petstore API (пример)"
    
  # Локальные файлы
  - type: file
    path: "components/information-system/api/swagger.json"
    description: "Information System API (JSON)"
    
  # Папки с файлами
  - type: directory
    path: "components/information-system/api/"
    description: "Все файлы из папки api"
    patterns: ["*.json", "*.yaml", "*.yml"]

# Настройки генерации
settings:
  output_suffix: ""
