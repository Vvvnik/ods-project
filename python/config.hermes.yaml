workspace: ..

description:
  input_dir: tools/jira
  output_dir: input_dir
  # file_name: description.hermes
  file_name: description-2
  bundle_subdirs_prefix: "ODS-"
  issue_order_file: tools/jira/jira_main_issues.txt
  max_adoc_text_chars: 32000
  max_context_chars: 96000

hermes:
  # SDK mode (AIAgent): используем локальный репозиторий Hermes.
  hermes_repo_path: "${HERMES_REPO_PATH:-/Users/vvv/.hermes/hermes-agent}"
  # Опционально: явный Python интерпретатор для Hermes SDK.
  hermes_python_path: "${HERMES_PYTHON_PATH:-}"
  timeout_sec: 120
  retry_attempts: 2
  # Hermes AIAgent требует окно ≥64000 токенов; qwen3:14b в каталоге — 40960.
  # Задаём model.context_length для SDK (см. hermes_client), без правок ~/.hermes/config.yaml.
  model: "${HERMES_MODEL:-gemma4:latest}" 
  # model: "${HERMES_MODEL:-gpt-oss:20b}" 
  # context_length: "${HERMES_CONTEXT_LENGTH:-65536}"
  # Локальный Ollama (OpenAI-compatible endpoint).
  provider: "${HERMES_PROVIDER:-}"
  base_url: "${HERMES_BASE_URL:-http://127.0.0.1:11434/v1}"
  skip_memory: false
  skip_context_files: false
  # Пустой список: один AIAgent, один session_*.json, только LLM + skills (без browser_vision и др.).
  # Удалите ключ целиком — снова подключаются все toolsets Hermes.
  enabled_toolsets: []
  skills:
    # - "my/release_notes"
    - "my/description_writer"
    # - "my/asciidoc"
    - "my/markdown"
  # false — один AIAgent, эпики в одной цепочке диалога; true — новый чат (новая сессия Hermes) на каждый эпик
  session_toggle: true
