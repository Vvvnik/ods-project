stages: [build, deploy]

variables:
  # В CI Kroki доступен как сервис по алиасу 'kroki'
  KROKI_SERVER_URL: "http://kroki:8000"
  KROKI_IMAGE: "registry.gitlab.com/vvvnik/ods-project/kroki:0.28.0"  # pinned mirror in your registry
  GIT_DEPTH: "20"
  # Технические файлы, которые влияют на генерацию контента
  TECHNICAL_FILES: "tools/**,gitflic-ci.yaml,modules/**,antora-playbook.yml,components/*/antora.yml,resources/**"

# Объединенная сборка: PDF + сайт
build_all:
  stage: build
  image: registry.gitlab.com/vvvnik/ods-project/ruby-node-antora:2
  services:
    - name: $KROKI_IMAGE
      alias: kroki
  rules:
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CI_COMMIT_REF_NAME == "main"'
      changes:
        - $TECHNICAL_FILES
        - antora-*.yml
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: on_success
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - .npm/
  script:
    - ruby -v
    - node --version && npm --version
    - echo "=== PDF build START ==="
    - ruby tools/start.rb
    - echo "=== PDF build END ==="
    - npm config set cache .npm --global
    - if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
    - antora antora-playbook.yml
    - if [ ! -d public ]; then mkdir -p public && cp -a build/site/. public/; fi
  artifacts:
    when: always
    paths: [public]
    expire_in: 3 days

pages:
  stage: deploy
  needs: [build_all]
  rules:
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CI_COMMIT_REF_NAME == "main"'
      changes:
        - $TECHNICAL_FILES
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: on_success
  script: ['echo "Deploy GitFlic Pages"']
  artifacts:
    paths: [public]
    expire_in: never

# Подготовка release notes по тегу
prepare_release_notes:
  stage: deploy
  image: alpine:latest
  rules:
    - if: "$CI_COMMIT_TAG"
      when: on_success
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch --prune --tags origin "+refs/tags/*:refs/tags/*"
    - |
      if [ -e .git/shallow ]; then
        echo "Repository is shallow, unshallowing...";
        git fetch --unshallow || true;
      fi
  script:
    - echo "Preparing release notes for $CI_COMMIT_TAG ..."
    - |
      set -e
      mkdir -p dist
      # Определяем предыдущий тег (если есть) — надёжно, с несколькими стратегиями
      CUR_TAG="$CI_COMMIT_TAG"
      PREV_TAG=""
      # 1) Попытка через describe от родителя тега
      PREV_TAG=$(git describe --tags --abbrev=0 "${CUR_TAG}^" 2>/dev/null || true)
      # 2) Если не нашли, взять ПРЕДЫДУЩИЙ тег в сортировке по версии (до текущего)
      if [ -z "$PREV_TAG" ]; then
        TAGS=$(git tag --list | sort -V)
        # Найти строку, предшествующую текущей (prev)
        PREV_TAG=$(printf "%s\n" "$TAGS" | awk -v cur="$CUR_TAG" '$0==cur { print prev; exit } { prev=$0 }')
      fi
      # 3) Если и это не помогло, взять предыдущий по дате создания (исключая текущий)
      if [ -z "$PREV_TAG" ]; then
        PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CUR_TAG}$" | head -n1 || true)
      fi

      if [ -n "$PREV_TAG" ]; then
        RANGE="$PREV_TAG..$CUR_TAG"
      else
        RANGE="$CUR_TAG"
      fi
      echo "Current tag: $CUR_TAG" >&2
      echo "Previous tag: ${PREV_TAG:-<none>}" >&2
      {
        echo "## Коммиты в $CI_COMMIT_TAG";
        if [ -n "$PREV_TAG" ]; then
          echo "Отличия от ${PREV_TAG}";
        fi
        echo "";
        git log --no-merges \
          --pretty="%n. link:${CI_PROJECT_URL}/commit/%H[%h — %s — %an (%ad)]" \
          --name-only \
          --date=short $RANGE | awk 'BEGIN{}\
          { if ($0 ~ /^\. link:/) { print; next } \
            else if ($0 ~ /^\s*$/) { print ""; next } \
            else { print ".. " $0 } }';
      } > dist/release-notes.adoc
      echo "Generated release notes:"; cat dist/release-notes.adoc
  artifacts:
    paths:
      - dist/release-notes.adoc
    expire_in: 3 days

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [prepare_release_notes]
  rules:
    - if: "$CI_COMMIT_TAG"
      when: on_success
  script:
    - echo "Creating GitFlic Release for tag $CI_COMMIT_TAG"
    - |
      set -e
      export RELEASE_NOTES="$(cat dist/release-notes.adoc 2>/dev/null || echo "Release $CI_COMMIT_TAG")"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: "$RELEASE_NOTES"
    assets:
      links:
        - name: "release-notes.adoc"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/release-notes.adoc?job=prepare_release_notes"
          filepath: "/release-notes.adoc"
          link_type: other