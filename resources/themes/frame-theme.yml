# Тема для документов с рамками - увеличенные поля для размещения рамок
extends: report

title_page:
  margin: [10mm, 10mm, 25mm, 10mm]  
  
page:
  size: A4
  margin: [15mm, 10mm, 25mm, 25mm]  # Увеличенные поля для рамок
  margin-rotated: [20mm, 10mm, 35mm, 10mm]
  mode: fullscreen thumbs

font:
  catalog:
    # merge: false
    
    M+ 1mn:
      normal: times-new-roman-normal.ttf
      bold: times-new-roman-bold.ttf
      italic: times-new-roman-italic.ttf
      bold_italic: times-new-roman-bold-italic.ttf

    Times:
      normal: times-new-roman-normal.ttf
      italic: times-new-roman-italic.ttf
      bold: times-new-roman-bold.ttf
      bold_italic: times-new-roman-bold-italic.ttf

    Roboto:
      normal: Roboto-Regular.ttf
      bold: Roboto-Bold.ttf
      italic: Roboto-Italic.ttf
      bold_italic: Roboto-BoldItalic.ttf

    M+ 1p:
      normal: times-new-roman-normal.ttf
      bold: times-new-roman-bold.ttf
      italic: times-new-roman-italic.ttf
      bold_italic: times-new-roman-bold-italic.ttf

    Noto Serif:
      normal: times-new-roman-normal.ttf
      bold: times-new-roman-bold.ttf
      italic: times-new-roman-italic.ttf
      bold_italic: times-new-roman-bold-italic.ttf

    Noto Sans:
      normal: times-new-roman-normal.ttf
      bold: times-new-roman-bold.ttf
      italic: times-new-roman-italic.ttf
      bold_italic: times-new-roman-bold-italic.ttf


