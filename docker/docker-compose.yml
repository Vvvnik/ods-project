services:
  # Генерация PDF документов
  pdf:
    image: registry.gitlab.com/vvvnik/ods-project/ruby-node-antora:2
    container_name: ods-project-pdf
    volumes:
      - ${PWD}:/app
    working_dir: /app
    command: ruby tools/start.rb
    environment:
      - DB_HOST=host.docker.internal
      - OLLAMA_HOST=http://host.docker.internal:11434
      - TZ=Europe/Moscow
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: bridge

  # Сборка сайта с Antora
  site:
    image: registry.gitlab.com/vvvnik/ods-project/ruby-node-antora:2
    container_name: ods-project-site
    volumes:
      - ${PWD}:/app
    working_dir: /app
    command: antora antora-playbook.yml
    network_mode: bridge
