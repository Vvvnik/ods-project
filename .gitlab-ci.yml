# Три сценария пайплайна:
# 1) MR – только merge_conflicts_check
# 2) Push в main – build_all + pages (полная сборка)
# 3) Теги – prepare_release_notes + release (без изменений)
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - when: never

stages: [mr, build, deploy]

variables:
  KROKI_SERVER_URL: "http://kroki:8000"
  KROKI_IMAGE: "registry.gitlab.com/vvvnik/ods-project/kroki:0.28.0"
  RUBY_NODE_ANTORA_IMAGE: "registry.gitlab.com/vvvnik/ods-project/ruby-node-antora:2"
  GIT_DEPTH: "0"

# Сборка только при push в main; не на MR и не на тегах
.rules_main_push_build:
  rules:
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

merge_conflicts_check:
  stage: mr
  image: $RUBY_NODE_ANTORA_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - git fetch --depth=1 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      if ! git merge --no-commit --no-ff "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"; then
        echo "Merge conflicts with ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
        exit 1
      fi
    - git merge --abort 2>/dev/null || true

build_all:
  extends: .rules_main_push_build
  stage: build
  # Зависимости playbook (asciidoctor-kroki и т.д.) в образе: docker/Dockerfile.universal + NODE_PATH
  image: $RUBY_NODE_ANTORA_IMAGE
  services:
    - name: $KROKI_IMAGE
      alias: kroki
  script:
    - ruby tools/start.rb
    - antora generate --attribute kroki-server-url=$KROKI_SERVER_URL antora-playbook.yml
  artifacts:
    when: always
    paths: [public]
    expire_in: 3 days

pages:
  extends: .rules_main_push_build
  stage: deploy
  needs:
    - job: build_all
      artifacts: true
  script: ['echo "Deploy GitLab Pages"']
  artifacts:
    paths: [public]
    expire_in: never

prepare_release_notes:
  stage: deploy
  image: alpine:latest
  rules:
    - if: "$CI_COMMIT_TAG"
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch --prune --tags origin "+refs/tags/*:refs/tags/*"
    - |
      if [ -e .git/shallow ]; then
        echo "Repository is shallow, unshallowing...";
        git fetch --unshallow || true;
      fi
  script:
    - echo "Preparing release notes for $CI_COMMIT_TAG ..."
    - |
      set -e
      mkdir -p dist
      CUR_TAG="$CI_COMMIT_TAG"
      PREV_TAG=""
      PREV_TAG=$(git describe --tags --abbrev=0 "${CUR_TAG}^" 2>/dev/null || true)
      if [ -z "$PREV_TAG" ]; then
        TAGS=$(git tag --list | sort -V)
        PREV_TAG=$(printf "%s\n" "$TAGS" | awk -v cur="$CUR_TAG" '$0==cur { print prev; exit } { prev=$0 }')
      fi
      if [ -z "$PREV_TAG" ]; then
        PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CUR_TAG}$" | head -n1 || true)
      fi
      if [ -n "$PREV_TAG" ]; then
        RANGE="$PREV_TAG..$CUR_TAG"
      else
        RANGE="$CUR_TAG"
      fi
      echo "Current tag: $CUR_TAG" >&2
      echo "Previous tag: ${PREV_TAG:-<none>}" >&2
      {
        echo "## Коммиты в $CI_COMMIT_TAG";
        if [ -n "$PREV_TAG" ]; then
          echo "Отличия от ${PREV_TAG}";
        fi
        echo "";
        git log --no-merges \
          --pretty="%n. link:${CI_PROJECT_URL}/commit/%H[%h – %s – %an (%ad)]" \
          --name-only \
          --date=short $RANGE | awk 'BEGIN{}\
          { if ($0 ~ /^\. link:/) { print; next } \
            else if ($0 ~ /^\s*$/) { print ""; next } \
            else { print ".. " $0 } }';
      } > dist/release-notes.adoc
      echo "Generated release notes:"; cat dist/release-notes.adoc
  artifacts:
    paths:
      - dist/release-notes.adoc
    expire_in: 3 days

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:v0.15.0
  needs: [prepare_release_notes]
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - echo "Creating GitLab Release for tag $CI_COMMIT_TAG"
    - |
      set -e
      export RELEASE_NOTES="$(cat dist/release-notes.adoc 2>/dev/null || echo "Release $CI_COMMIT_TAG")"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Release $CI_COMMIT_TAG"
    description: "$RELEASE_NOTES"
    assets:
      links:
        - name: "release-notes.adoc"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/release-notes.adoc?job=prepare_release_notes"
          filepath: "/release-notes.adoc"
          link_type: other
